# Spring Boot Application Properties
# These are default values that can be overridden by environment variables or .env file

# Spring Data JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${POSTGRES_USER}
spring.flyway.password=${POSTGRES_PASSWORD}

# Database connection (will be overridden by environment variables in docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/secureorder
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT Configuration (in production, these would come from environment variables)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=300000  # 5 minutes

# Server Configuration
server.port=8080
server.servlet.context-path=

# Spring MVC
spring.mvc.pathmatch.matching-strategy=ant_path_matcher